name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'let-aurn/swagger-client'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Validate release version and select npm tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}, got ${process.env.RELEASE_TAG}`);
          }
          const distTag = version.includes('-') || process.env.RELEASE_PRERELEASE === 'true'
            ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${distTag}\n`);
          console.log(`Publishing version ${version} with npm tag ${distTag}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm with provenance
        run: npm publish --provenance --tag "$NPM_DIST_TAG"
